<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dine & Divide</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="index.js" defer></script>
</head>
<body>
  <div id="container">
    <h1>Dine<span id="symbol">&</span>Divide</h1>
    <hr>
    <h2>Dine together. Divide smarter.</h2>
    
    <div class="card">
      <form id="billForm">
        <div class="row">
          <label for="subtotalInput">Subtotal</label>
          <div class="inputBox">
            <span>$</span>
            <input type="number" id="subtotalInput" required step="0.01" min="0" placeholder="0.00">
          </div>
        </div>
        <div class="row">
          <label for="tipRateInput">Tip Rate</label>
          <div class="inputBox">
            <input type="number" id="tipRateInput" min="0" placeholder="0">
            <span>%</span>
          </div>
        </div>
        <div class="row">
          <label for="taxRateInput">Tax Rate</label>
          <div class="inputBox">
            <input type="number" id="taxRateInput" required step=".001" min="0" placeholder="0.000">
            <span>%</span>
          </div>
        </div>
        <div class="row">
          <label for="people">Party of:</label>
          <div class="inputBox">
            <input type="number" id="people" min="1" value="1" placeholder="1">
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="output">
        <h3>Tip</h3>
        <p id="tipResult">$0.00</p>
      </div>
      <div class="output">
        <h3>Tax</h3>
        <p id="taxResult">$0.00</p>
      </div>
      <div class="output">
        <h3>Total</h3>
        <p id="totalResult">$0.00</p>
      </div>
      <div class="output">
        <h3>You Pay</h3>
        <p id="perPersonResult">$0.00</p>
      </div>
    </div>
  </div>
</body>
</html>
